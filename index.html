<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>حدث خطأ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #f4f6fa; color: #18243a;
      font-family: Tahoma, Arial, sans-serif;
    }
    .panel {
      width: min(100%, 460px); padding: 48px 30px; text-align: center;
      background: #fff; border: 1px solid #e7ebf2; border-radius: 18px;
      box-shadow: 0 14px 45px rgba(20, 38, 68, .08);
    }
    .symbol {
      width: 76px; height: 76px; margin: 0 auto 24px; display: grid;
      place-items: center; border-radius: 50%; background: #fff2f0;
      color: #d94b42; font-size: 42px; font-weight: 700;
    }
    h1 { margin: 0 0 12px; font-size: 25px; font-weight: 700; }
    p { margin: 0; color: #697589; font-size: 16px; line-height: 1.9; }
    .code { margin-top: 28px; color: #a0a9b7; font-size: 12px; letter-spacing: 1px; }
  </style>
</head>
<body>
  <main class="panel" role="alert" aria-live="polite">
    <div class="symbol" aria-hidden="true">!</div>
    <h1>حدث خطأ</h1>
    <p>نعتذر، تعذّر إكمال طلبك حاليًا.<br>حاول مرة أخرى في وقت لاحق.</p>
    <div class="code">ERROR · 503</div>
  </main>
</body>
</html>
